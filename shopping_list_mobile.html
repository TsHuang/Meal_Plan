
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        
        <!-- Mobile Meta -->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="theme-color" content="#0f172a">
        
        <title>Shopping List</title>
        <style>
    :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
        --border: rgba(255,255,255,0.08);
        --checked-bg: rgba(56, 189, 248, 0.1);
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        padding-top: env(safe-area-inset-top, 20px);
        padding-bottom: env(safe-area-inset-bottom, 20px);
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
    }
    .header {
        text-align: center;
        margin-bottom: 25px;
    }
    h1 {
        font-size: 1.8rem;
        margin-bottom: 5px;
        color: var(--accent);
    }
    
    .week-group {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 25px;
        border: 1px solid var(--border);
    }
    .week-title {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--text-main);
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .shop-items {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .shop-item {
        display: flex;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .shop-item:last-child {
        border-bottom: none;
    }
    
    /* Custom Checkbox */
    .checkbox-custom {
        width: 24px;
        height: 24px;
        border: 2px solid var(--accent);
        border-radius: 6px;
        margin-right: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .checkbox-custom::after {
        content: "✔";
        color: var(--bg-color);
        font-size: 14px;
        font-weight: bold;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s;
    }
    
    .shop-item.checked {
        opacity: 0.4;
        text-decoration: line-through;
    }
    .shop-item.checked .checkbox-custom {
        background: var(--accent);
    }
    .shop-item.checked .checkbox-custom::after {
        opacity: 1;
        transform: scale(1);
    }
    
    .item-name {
        flex-grow: 1;
        font-size: 1.05rem;
    }
    .item-count {
        background: rgba(255,255,255,0.1);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: bold;
    }
    </style>
    </style>
    </head>
    <body>
        <div class="header">
            <h1>🛒 Shopping List</h1>
            <p style="color:#94a3b8; margin:0;">Tap to check off items</p>
        </div>
    

        <div class="week-group">
            <h3 class="week-title">Week 1</h3>
            <ul class="shop-items">
        

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">四季豆或長豆</span>
                    <span class="item-count">x2</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">地瓜葉</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">娃娃菜</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">干貝</span>
                    <span class="item-count">x3</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">牛小排</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">腐竹</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">茄子</span>
                    <span class="item-count">x2</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">虱目魚</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">蝦子</span>
                    <span class="item-count">x2</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">豆腐</span>
                    <span class="item-count">x2</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">金針菇</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">雞蛋</span>
                    <span class="item-count">x3</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">高麗菜</span>
                    <span class="item-count">x1</span>
                </li>
            

                <li class="shop-item" onclick="this.classList.toggle('checked')">
                    <div class="checkbox-custom"></div>
                    <span class="item-name">鮭魚</span>
                    <span class="item-count">x1</span>
                </li>
            
</ul></div>

    </body>
    </html>
